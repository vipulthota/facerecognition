<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New User - Face Recognition Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf9f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .registration-form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }
        #video {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: red;
            margin: 10px 0;
        }
        .success-message {
            color: green;
            margin: 10px 0;
        }
        .progress {
            height: 25px;
            margin: 20px 0;
        }
        .progress-bar {
            background-color: #007bff;
            transition: width 0.3s ease;
        }
        .progress-text {
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
        }
        .capture-instructions {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    {% include 'navbar_logout.html' %}
    <div class="container">
        <h1 class="text-center mb-4">Register New User</h1>
        
        <div class="registration-form">
            <form id="registrationForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label for="userid" class="form-label">Roll Number/ID</label>
                    <input type="text" class="form-control" id="userid" required>
                </div>
                
                <div class="capture-instructions">
                    <h5>Capture Instructions:</h5>
                    <ul>
                        <li>Please capture 10 images of your face</li>
                        <li>Try different angles and expressions</li>
                        <li>Ensure good lighting and clear visibility</li>
                        <li>Keep your face within the frame</li>
                    </ul>
                </div>
                
                <div class="video-container mb-3">
                    <video id="video" autoplay></video>
                    <button type="button" class="btn btn-primary w-100" id="captureImage">
                        <i class="fas fa-camera"></i> Capture Image
                    </button>
                </div>
                
                <div class="progress">
                    <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <div id="progressText" class="progress-text">0/10 images captured</div>
                
                <div id="captureStatus" class="mb-3"></div>
                
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-user-plus"></i> Register User
                </button>
            </form>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const captureImageBtn = document.getElementById('captureImage');
        const registrationForm = document.getElementById('registrationForm');
        const captureStatus = document.getElementById('captureStatus');
        
        let imageCount = 0;
        const requiredImages = 10;
        
        // Initialize camera
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error('Error accessing camera:', err);
                captureStatus.innerHTML = '<div class="error-message">Error accessing camera. Please check camera permissions.</div>';
            });
        
        // Handle image capture
        captureImageBtn.addEventListener('click', async () => {
            if (imageCount >= requiredImages) {
                captureStatus.innerHTML = '<div class="success-message">All required images captured!</div>';
                return;
            }
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const imageData = canvas.toDataURL('image/jpeg');
            
            const formData = new FormData();
            formData.append('face_image', dataURLtoFile(imageData, 'capture.jpg'));
            formData.append('username', document.getElementById('username').value);
            formData.append('userid', document.getElementById('userid').value);
            formData.append('image_count', imageCount);
            formData.append('source', 'webcam');
            
            try {
                const response = await fetch('/capture_image', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    imageCount++;
                    // Update progress bar
                    const progress = (imageCount / requiredImages) * 100;
                    document.getElementById('progressBar').style.width = `${progress}%`;
                    document.getElementById('progressBar').setAttribute('aria-valuenow', progress);
                    document.getElementById('progressText').textContent = `${imageCount}/${requiredImages} images captured`;
                    
                    if (imageCount < requiredImages) {
                        captureStatus.innerHTML = `<div class="success-message">Image ${imageCount}/${requiredImages} captured successfully! Please capture more images from different angles.</div>`;
                    } else {
                        captureStatus.innerHTML = '<div class="success-message">All required images captured! You can now register.</div>';
                    }
                } else {
                    captureStatus.innerHTML = `<div class="error-message">${result.message}</div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                captureStatus.innerHTML = '<div class="error-message">Error capturing image</div>';
            }
        });
        
        // Handle form submission
        registrationForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (imageCount < requiredImages) {
                captureStatus.innerHTML = `<div class="error-message">Please capture ${requiredImages} images before registering</div>`;
                return;
            }
            
            const username = document.getElementById('username').value;
            const userid = document.getElementById('userid').value;
            
            try {
                const response = await fetch('/complete_registration', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        userid: userid
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    captureStatus.innerHTML = '<div class="success-message">User registered successfully!</div>';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    captureStatus.innerHTML = `<div class="error-message">${result.message}</div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                captureStatus.innerHTML = '<div class="error-message">Error registering user</div>';
            }
        });
        
        // Helper function to convert data URL to File
        function dataURLtoFile(dataurl, filename) {
            const arr = dataurl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new File([u8arr], filename, { type: mime });
        }
    </script>
</body>
</html>
