<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf9f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            display: none;
        }
        .file-upload-container {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            display: none;
        }
        #video {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .attendance-list {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: red;
            margin: 10px 0;
        }
        .success-message {
            color: green;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    {% include 'navbar_logout.html' %}
    <div class="container">
        <h1 class="text-center mb-4">Face Recognition Attendance System</h1>
        
        <div class="video-container" id="videoContainer">
            <video id="video" autoplay></video>
            <button class="btn btn-primary w-100" id="markAttendance">
                <i class="fas fa-smile"></i> Mark Attendance
            </button>
        </div>

        <div class="file-upload-container" id="fileUploadContainer">
            <form id="uploadForm">
                <div class="mb-3">
                    <label for="faceImage" class="form-label">Upload Face Image for Attendance</label>
                    <input type="file" class="form-control" id="faceImage" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-upload"></i> Mark Attendance
                </button>
            </form>
        </div>

        <div class="attendance-list">
            <h2>Today's Attendance</h2>
            <div id="attendanceList">
                {% for i in range(l) %}
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span>{{names[i]}} ({{rolls[i]}})</span>
                    <span>{{times[i]}}</span>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        // Check if we're running on AWS
        const isAWS = window.location.hostname.includes('amazonaws.com') || 
                     window.location.hostname.includes('aws') ||
                     !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia;

        const videoContainer = document.getElementById('videoContainer');
        const fileUploadContainer = document.getElementById('fileUploadContainer');
        const video = document.getElementById('video');
        const markAttendanceBtn = document.getElementById('markAttendance');
        const uploadForm = document.getElementById('uploadForm');

        // Show appropriate container based on environment
        if (isAWS) {
            videoContainer.style.display = 'none';
            fileUploadContainer.style.display = 'block';
        } else {
            videoContainer.style.display = 'block';
            fileUploadContainer.style.display = 'none';
            
            // Initialize camera
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                })
                .catch(err => {
                    console.error('Error accessing camera:', err);
                    videoContainer.style.display = 'none';
                    fileUploadContainer.style.display = 'block';
                });
        }

        // Handle file upload for AWS
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('faceImage');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select an image file');
                return;
            }

            const formData = new FormData();
            formData.append('face_image', file);

            try {
                const response = await fetch('/mark_attendance', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(`Attendance marked for ${result.name}`, 'success');
                    updateAttendanceList();
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Error marking attendance', 'error');
            }
        });

        // Handle camera attendance marking
        markAttendanceBtn.addEventListener('click', async () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const imageData = canvas.toDataURL('image/jpeg');
            
            try {
                const response = await fetch('/mark_attendance', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ image: imageData })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(`Attendance marked for ${result.name}`, 'success');
                    updateAttendanceList();
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Error marking attendance', 'error');
            }
        });

        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = type === 'success' ? 'success-message' : 'error-message';
            messageDiv.textContent = message;
            
            const container = document.querySelector('.container');
            container.insertBefore(messageDiv, container.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }

        async function updateAttendanceList() {
            try {
                const response = await fetch('/get_attendance');
                const attendance = await response.json();
                
                const attendanceList = document.getElementById('attendanceList');
                attendanceList.innerHTML = '';
                
                attendance.forEach(record => {
                    const div = document.createElement('div');
                    div.className = 'd-flex justify-content-between align-items-center mb-2';
                    div.innerHTML = `
                        <span>${record.name} (${record.roll})</span>
                        <span>${record.time}</span>
                    `;
                    attendanceList.appendChild(div);
                });
            } catch (error) {
                console.error('Error updating attendance list:', error);
            }
        }
    </script>
</body>
</html>
